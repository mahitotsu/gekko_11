# クラスタの中では、SVID で TLS を受ける。サービスは SVID の証明書を示し、ブラウザ役は示さない（client-auth: want）。
# spiffe-helper が SVID_DIR に書き出し、入れ替わったら読み直す。
# ブラウザは、クラスタの入口を通る。入口が付ける転送のヘッダーで、ブラウザが呼んだ URL（DPoP の htu）を知る（D-25）。
server:
  port: 8443
  forward-headers-strategy: framework
  ssl:
    bundle: svid
    client-auth: want
spring:
  ssl:
    bundle:
      pem:
        svid:
          reload-on-update: true
          keystore:
            certificate: file:${SVID_DIR}/svid.pem
            private-key: file:${SVID_DIR}/svid_key.pem
          truststore:
            certificate: file:${SVID_DIR}/svid_bundle.pem
