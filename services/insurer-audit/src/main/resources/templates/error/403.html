<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>監査: 見られません</title>
  <th:block th:replace="~{style :: style}"></th:block>
</head>
<body>
<main class="container-lg py-5">
  <h1 class="h4" data-testid="forbidden">この画面は、監査の担当だけが見られます</h1>
  <p class="text-body-secondary">今のログインは、監査の担当ではありません。サインアウトしてから、監査の担当でログインしてください。</p>
  <form th:replace="~{style :: signout}"></form>
</main>
</body>
</html>
