<!-- 監査の画面の共通の部品（D-48）。見た目は Bootstrap 5 で、CSS は WebJars から配る。色のモードは theme.js が OS の設定に合わせる（F-G105）。 -->
<th:block th:fragment="style">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/assets/audit.css}">
  <script th:src="@{/assets/theme.js}"></script>
</th:block>

<!-- 見出しの帯。名前空間を出し、防御を外せる複製（vulnerable）なら目立たせる -->
<nav th:fragment="navbar(title)" class="navbar border-bottom bg-body-tertiary mb-4">
  <div class="container-lg flex-wrap gap-2">
    <span class="navbar-brand d-flex align-items-center gap-2 mb-0">
      <span class="badge text-bg-primary">教</span>
      <span>教材保険会社 <span class="text-body-secondary fw-normal" th:text="${title}">監査</span></span>
    </span>
    <span th:if="${namespace != null}" class="badge rounded-pill" th:classappend="${namespace == 'secure'} ? 'text-bg-secondary' : 'text-bg-warning'" data-testid="namespace"
          th:text="${namespace == 'secure'} ? '名前空間: secure' : '⚠ 防御を外せる複製（' + ${namespace} + '）'">名前空間</span>
    <span class="ms-auto d-flex align-items-center gap-2">
      <span class="who small">監査の担当: <span th:text="${user}">kansa</span></span>
      <form th:replace="~{style :: signout}"></form>
    </span>
  </div>
</nav>

<form th:fragment="signout" th:action="@{/logout}" method="post" class="signout m-0">
  <button type="submit" class="btn btn-sm btn-outline-secondary" data-testid="signout">サインアウト</button>
</form>
