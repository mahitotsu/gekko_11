 r="4.5"/><path class="ink2" d="M410.5,61 Q410.5,52 419.5,52 Q428.5,52 428.5,61 Z"/><rect class="k1" x="402" y="136" width="147" height="52" rx="6"/><text x="475.5" y="158" class="ink" font-size="12" text-anchor="middle" font-weight="600">営業 AI エージェント</text><text x="475.5" y="174" class="ink2" font-size="11" text-anchor="middle" font-weight="400">代理人</text><rect class="box" x="419.5" y="246" width="112" height="52" rx="6"/><text x="475.5" y="268" class="ink" font-size="12" text-anchor="middle" font-weight="600">保険会社</text><text x="475.5" y="284" class="ink2" font-size="11" text-anchor="middle" font-weight="400">取引の相手</text><rect class="bg" x="39" y="98.5" width="74" height="17"/><text x="76" y="110.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">申込みを頼む</text><rect class="bg" x="39" y="208.5" width="74" height="17"/><text x="76" y="220.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">申込書を運ぶ</text><rect class="bg" x="438.5" y="98.5" width="74" height="17"/><text x="475.5" y="110.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">申込みを頼む</text><rect class="bg" x="438.5" y="208.5" width="74" height="17"/><text x="475.5" y="220.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">申込みを運ぶ</text></g><text x="20" y="352" class="ink2" font-size="11" text-anchor="start" font-weight="400">どちらも、取引の相手に届くのは、代理人が運んだ依頼と、代理人の言い分である。</text>
