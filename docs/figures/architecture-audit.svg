-weight="400">システム</text><text x="692" y="368" class="ink2" font-size="11" text-anchor="middle" font-weight="400">契約の記録</text><rect class="box" x="0" y="102" width="560" height="52" rx="6"/><text x="280" y="124" class="ink" font-size="12" text-anchor="middle" font-weight="600">Alloy</text><text x="280" y="140" class="ink2" font-size="11" text-anchor="middle" font-weight="400">書いた Pod の印を付ける</text><path class="box" d="M0,211 A280,7 0 0 1 560,211 L560,257 A280,7 0 0 1 0,257 Z"/><path class="box" d="M0,211 A280,7 0 0 0 560,211" fill="none"/><text x="280" y="233.5" class="ink" font-size="12" text-anchor="middle" font-weight="600">Loki（名前空間ごと）</text><text x="280" y="249.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">7 日保つ</text><rect class="k1" x="223" y="322" width="149" height="52" rx="6"/><text x="297.5" y="344" class="ink" font-size="12" text-anchor="middle" font-weight="600">監査サービス</text><text x="297.5" y="360" class="ink2" font-size="11" text-anchor="middle" font-weight="400">契約ごとに突き合わせる</text><rect class="box" x="247.5" y="432" width="112" height="48" rx="6"/><text x="309.5" y="460" class="ink" font-size="12" text-anchor="middle" font-weight="600">監査の担当</text><circle class="ink2" cx="241.5" cy="450" r="4.5"/><path class="ink2" d="M232.5,466 Q232.5,457 241.5,457 Q250.5,457 250.5,466 Z"/><rect class="bg" x="42" y="68.5" width="63" height="17"/><text x="73.5" y="80.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">会話の記録</text><rect class="bg" x="260.5" y="68.5" width="74" height="17"/><text x="297.5" y="80.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">ツールの記録</text><rect class="bg" x="472.5" y="68.5" width="63" height="17"/><text x="504" y="80.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">交換の記録</text><rect class="bg" x="660.5" y="212.5" width="63" height="17"/><text x="692" y="224.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">契約の記録</text><rect class="bg" x="259.5" y="170.5" width="41" height="17"/><text x="280" y="182.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">届ける</text><rect class="bg" x="266" y="284.5" width="63" height="17"/><text x="297.5" y="296.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">記録を読む</text><rect class="bg" x="461.5" y="339.5" width="85" height="17"/><text x="504" y="351.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">自己申告を読む</text><rect class="bg" x="255" y="394.5" width="85" height="17"/><text x="297.5" y="406.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">食い違いを見る</text></g><rect class="k1" x="20" y="514" width="10" height="10" rx="2"/><text x="36" y="523" class="ink" font-size="12" text-anchor="start" font-weight="400">記録を作る者と別の、確かめる者</text><text x="20" y="542" class="ink2" font-size="11" text-anchor="start" font-weight="400">破線は、書き換えうる者（営業 AI エージェント）の自己申告。突き合わせの根拠にしない</text>
</svg>
