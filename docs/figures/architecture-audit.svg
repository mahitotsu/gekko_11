iddle" font-weight="600">保険会社の</text><text x="704" y="368" class="ink2" font-size="11" text-anchor="middle" font-weight="400">システム</text><text x="704" y="384" class="ink2" font-size="11" text-anchor="middle" font-weight="400">契約の記録</text><rect class="box" x="0" y="118" width="572" height="52" rx="6"/><text x="286" y="140" class="ink" font-size="12" text-anchor="middle" font-weight="600">Alloy</text><text x="286" y="156" class="ink2" font-size="11" text-anchor="middle" font-weight="400">書いた Pod の印を付ける</text><path class="box" d="M0,227 A286,7 0 0 1 572,227 L572,273 A286,7 0 0 1 0,273 Z"/><path class="box" d="M0,227 A286,7 0 0 0 572,227" fill="none"/><text x="286" y="249.5" class="ink" font-size="12" text-anchor="middle" font-weight="600">Loki（名前空間ごと）</text><text x="286" y="265.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">7 日保つ</text><rect class="k1" x="223" y="338" width="149" height="52" rx="6"/><text x="297.5" y="360" class="ink" font-size="12" text-anchor="middle" font-weight="600">監査サービス</text><text x="297.5" y="376" class="ink2" font-size="11" text-anchor="middle" font-weight="400">契約ごとに突き合わせる</text><rect class="box" x="247.5" y="448" width="112" height="48" rx="6"/><text x="309.5" y="476" class="ink" font-size="12" text-anchor="middle" font-weight="600">監査の担当</text><circle class="ink2" cx="241.5" cy="466" r="4.5"/><path class="ink2" d="M232.5,482 Q232.5,473 241.5,473 Q250.5,473 250.5,482 Z"/><rect class="bg" x="42" y="80.5" width="63" height="17"/><text x="73.5" y="92.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">会話の記録</text><rect class="bg" x="260.5" y="80.5" width="74" height="17"/><text x="297.5" y="92.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">ツールの記録</text><rect class="bg" x="462" y="84.5" width="96" height="17"/><text x="510" y="96.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">発行と交換の記録</text><rect class="bg" x="672.5" y="228.5" width="63" height="17"/><text x="704" y="240.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">契約の記録</text><rect class="bg" x="265.5" y="186.5" width="41" height="17"/><text x="286" y="198.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">届ける</text><rect class="bg" x="266" y="300.5" width="63" height="17"/><text x="297.5" y="312.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">記録を読む</text><rect class="bg" x="467.5" y="355.5" width="85" height="17"/><text x="510" y="367.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">自己申告を読む</text><rect class="bg" x="255" y="410.5" width="85" height="17"/><text x="297.5" y="422.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">食い違いを見る</text></g><rect class="k1" x="20" y="530" width="10" height="10" rx="2"/><text x="36" y="539" class="ink" font-size="12" text-anchor="start" font-weight="400">記録を作る者と別の、確かめる者</text><text x="20" y="558" class="ink2" font-size="11" text-anchor="start" font-weight="400">破線は、書き換えうる者（営業 AI エージェント）の自己申告。突き合わせの根拠にしない</text>
</svg>
