<rect class="bg" width="752" height="376"/>
<line class="dash" x1="76" x2="76" y1="60" y2="338"/><line class="dash" x1="276" x2="276" y1="60" y2="338"/><line class="dash" x1="476" x2="476" y1="60" y2="338"/><line class="dash" x1="676" x2="676" y1="60" y2="338"/><rect class="box" x="24" y="16" width="104" height="44" rx="6"/><text x="76" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">顧客</text><text x="76" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">本人</text><rect class="k1" x="224" y="16" width="104" height="44" rx="6"/><text x="276" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">営業 AI</text><text x="276" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">エージェント</text><rect class="box" x="424" y="16" width="104" height="44" rx="6"/><text x="476" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">事務</text><text x="476" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">サービス</text><rect class="box" x="624" y="16" width="104" height="44" rx="6"/><text x="676" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">保険会社の</text><text x="676" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">システム</text><polyline class="line" points="78,90 274,90"/><polygon class="head" points="274,90 266.6,86.9 266.6,93.1"/><text x="176" y="83" class="ink" font-size="12" text-anchor="middle" font-weight="400">ログインして、申込みを任せる</text><polyline class="line" points="278,130 474,130"/><polygon class="head" points="474,130 466.6,126.9 466.6,133.1"/><text x="376" y="123" class="ink" font-size="12" text-anchor="middle" font-weight="400">顧客を書いた欄で申込みを送る</text><rect class="grp" x="241.2" y="156" width="269.7" height="26" rx="4"/><text x="376" y="174" class="ink2" font-size="11" text-anchor="middle" font-weight="400">欄の「顧客 A」は、営業 AI エージェントの言い分</text><rect class="grp" x="405.5" y="196" width="141" height="26" rx="4"/><text x="476" y="214" class="ink2" font-size="11" text-anchor="middle" font-weight="400">本当かを確かめられない</text><polyline class="line" points="478,250 674,250"/><polygon class="head" points="674,250 666.6,246.9 666.6,253.1"/><text x="576" y="243" class="ink" font-size="12" text-anchor="middle" font-weight="400">申込みを、システムに入力する</text><rect class="grp" x="268" y="276" width="416" height="26" rx="4"/><text x="476" y="294" class="ink2" font-size="11" text-anchor="middle" font-weight="400">「顧客 B」と書けば、顧客 B の申込みとして入力される</text><text x="24" y="366" class="ink2" font-size="11" text-anchor="start" font-weight="400">確かめる要件が設計から抜けても、欄に値が入っていれば、普段どおりに動く。</text>
</svg>
