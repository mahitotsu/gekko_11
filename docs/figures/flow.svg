<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 536" width="720" height="536" role="img" aria-labelledby="t d">
<title id="t">保険の申込みから、会社からの直送までの流れ</title><desc id="d">営業員が名乗り、顧客が本人確認書類を見せる。営業員が複数案を示し、顧客が1案を選んで意向確認書面と申込書に署名する。営業員は、意向確認書面、申込書、確認記録と書類の写し、被保険者の同意、登録番号を一式にして事務センターへ回付する。事務センターは、本人、契約者の立場、営業員の登録、内容が署名したときのままかを確かめ、営業員を通さずに、本人確認済みの住所へ証券を郵送する。顧客は、手元の写しと証券を見比べる。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .ink3 { fill: #898781; } .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .box { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1; } .grp { fill: #f4f3f0; stroke: #e1e0d9; stroke-width: 1; } .track { fill: #e1e0d9; }
  .k1 { fill: #e8f0fb; stroke: #2a78d6; stroke-width: 1.5; } .k2 { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.5; }
  .kadd { fill: #e6f6ef; stroke: #1baf7a; stroke-width: 1.5; } .krem { fill: #fdeceb; stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; }
  .line { stroke: #52514e; stroke-width: 1.5; fill: none; } .dash { stroke: #9a9992; stroke-width: 1; stroke-dasharray: 4 3; fill: none; } .head { fill: #52514e; }
  .ladd { stroke: #1baf7a; stroke-width: 2; fill: none; } .lrem { stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; } .hadd { fill: #1baf7a; } .hrem { fill: #e34948; }
  .l1, .l2, .l3, .lg { stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; } .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; } .lg { stroke: #898781; }
  .link { stroke: #c3c2b7; stroke-width: 3; stroke-linecap: round; } .ring { stroke: #fcfcfb; stroke-width: 2; } .mark { stroke: #0b0b0b; stroke-width: 1.5; } .today { stroke: #0b0b0b; stroke-width: 1.5; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; } .s5 { fill: #e87ba4; } .gray { fill: #898781; } .onfill { fill: #0b0b0b; }
  .h1 { fill: #cde2fb; } .h2 { fill: #86b6ef; } .h3 { fill: #3987e5; } .h4 { fill: #1c5cab; } .h5 { fill: #0d366b; }
  .t1, .t2, .t3 { fill: #0b0b0b; } .t4, .t5 { fill: #ffffff; }
  .ok { fill: #0ca30c; } .warn { fill: #fab219; } .bad { fill: #d03b3b; } .glyph { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .ink3 { fill: #898781; } .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .box { fill: #242422; stroke: #4a4a46; } .grp { fill: #20201f; stroke: #2c2c2a; } .track { fill: #2c2c2a; }
    .k1 { fill: #17263a; stroke: #3987e5; } .k2 { fill: #3a2218; stroke: #d95926; }
    .kadd { fill: #12281f; stroke: #199e70; } .krem { fill: #3a1c1c; stroke: #e66767; }
    .line { stroke: #c3c2b7; } .dash { stroke: #7a7972; } .head { fill: #c3c2b7; }
    .ladd { stroke: #199e70; } .lrem { stroke: #e66767; } .hadd { fill: #199e70; } .hrem { fill: #e66767; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .link { stroke: #5a5a55; } .ring { stroke: #1a1a19; } .mark { stroke: #f0efec; } .today { stroke: #f0efec; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; } .s5 { fill: #d55181; }
    .h1 { fill: #0d366b; } .h2 { fill: #184f95; } .h3 { fill: #256abf; } .h4 { fill: #3987e5; } .h5 { fill: #9ec5f4; }
    .t1, .t2, .t3 { fill: #f0efec; } .t4, .t5 { fill: #0b0b0b; }
  }
</style>
<rect class="bg" width="720" height="536"/>
<line class="dash" x1="76" x2="76" y1="60" y2="498"/><line class="dash" x1="300" x2="300" y1="60" y2="498"/><line class="dash" x1="500" x2="500" y1="60" y2="498"/><rect class="box" x="24" y="16" width="104" height="44" rx="6"/><text x="76" y="42" class="ink" font-size="12" text-anchor="middle" font-weight="600">顧客</text><rect class="k1" x="247.5" y="16" width="105" height="44" rx="6"/><text x="300" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">営業員</text><text x="300" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">案を示し、運ぶ</text><rect class="box" x="448" y="16" width="104" height="44" rx="6"/><text x="500" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">事務センター</text><text x="500" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">会社の事務</text><polyline class="line" points="298,90 78,90"/><polygon class="head" points="78,90 85.4,93.1 85.4,86.9"/><text x="188" y="83" class="ink" font-size="12" text-anchor="middle" font-weight="400">氏名と所属を明らかにする</text><polyline class="line" points="78,130 298,130"/><polygon class="head" points="298,130 290.6,126.9 290.6,133.1"/><text x="188" y="123" class="ink" font-size="12" text-anchor="middle" font-weight="400">本人確認書類を見せる</text><polyline class="line" points="298,170 78,170"/><polygon class="head" points="78,170 85.4,173.1 85.4,166.9"/><text x="188" y="163" class="ink" font-size="12" text-anchor="middle" font-weight="400">記入済みの複数案と推奨理由を示す</text><polyline class="line" points="78,210 298,210"/><polygon class="head" points="298,210 290.6,206.9 290.6,213.1"/><text x="188" y="203" class="ink" font-size="12" text-anchor="middle" font-weight="400">1案を選び、意向確認書面に署名</text><polyline class="line" points="78,250 298,250"/><polygon class="head" points="298,250 290.6,246.9 290.6,253.1"/><text x="188" y="243" class="ink" font-size="12" text-anchor="middle" font-weight="400">申込書に署名（被保険者の同意も）</text><polyline class="dash" points="298,290 78,290"/><polyline class="line" points="85.2,293.5 78,290 85.2,286.5"/><text x="188" y="283" class="ink" font-size="12" text-anchor="middle" font-weight="400">申込書の写しを渡す</text><polyline class="line" points="302,330 498,330"/><polygon class="head" points="498,330 490.6,326.9 490.6,333.1"/><text x="400" y="323" class="ink" font-size="12" text-anchor="middle" font-weight="400">意向確認書面ほかの一式を回付</text><rect class="grp" x="236" y="356" width="328" height="26" rx="4"/><text x="400" y="374" class="ink2" font-size="11" text-anchor="middle" font-weight="400">本人、契約者の立場、営業員の登録、内容を確かめる（想定）</text><polyline class="line" points="498,410 78,410"/><polygon class="head" points="78,410 85.4,413.1 85.4,406.9"/><text x="288" y="403" class="ink" font-size="12" text-anchor="middle" font-weight="400">証券を直接郵送（営業員を通らない）</text><rect class="grp" x="62.5" y="436" width="251" height="26" rx="4"/><text x="188" y="454" class="ink2" font-size="11" text-anchor="middle" font-weight="400">写しと証券を見比べる。違えば会社へ直接連絡</text><text x="24" y="526" class="ink2" font-size="11" text-anchor="start" font-weight="400">実線は依頼や受け渡し、破線は戻り。</text>
</svg>
