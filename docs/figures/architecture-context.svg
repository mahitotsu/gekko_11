<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 368" width="930" height="368" role="img" aria-labelledby="t d">
<title id="t">営業 AI エージェントが顧客と保険会社の間に入る構成の全体像</title><desc id="d">顧客のアプリは、認可サーバーにログインし、営業 AI エージェントを呼ぶ証明 A を受け取る（破線）。顧客が選択して署名した申込みと A を、営業 AI エージェントに渡す。営業 AI エージェントは、A を認可サーバーで、事務サービスを顧客の代理として呼ぶ証明 B に替え（点線）、B で代理で申し込む。事務サービスは、B を、保険会社のシステムを呼ぶ証明 C に替え（点線）、C で申込みを回す。保険会社のシステムは C を検証して記録し、契約内容を顧客のアプリへ直接送る（破線）。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .ink3 { fill: #898781; } .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .box { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1; } .grp { fill: #f4f3f0; stroke: #e1e0d9; stroke-width: 1; } .track { fill: #e1e0d9; }
  .k1 { fill: #e8f0fb; stroke: #2a78d6; stroke-width: 1.5; } .k2 { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.5; }
  .kadd { fill: #e6f6ef; stroke: #1baf7a; stroke-width: 1.5; } .krem { fill: #fdeceb; stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; }
  .line { stroke: #52514e; stroke-width: 1.5; fill: none; } .dash { stroke: #9a9992; stroke-width: 1; stroke-dasharray: 4 3; fill: none; } .dot { stroke: #52514e; stroke-width: 2; stroke-dasharray: 0 5; stroke-linecap: round; fill: none; } .head { fill: #52514e; }
  .ladd { stroke: #1baf7a; stroke-width: 2; fill: none; } .lrem { stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; } .hadd { fill: #1baf7a; } .hrem { fill: #e34948; }
  .l1, .l2, .l3, .lg { stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; } .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; } .lg { stroke: #898781; }
  .link { stroke: #c3c2b7; stroke-width: 3; stroke-linecap: round; } .ring { stroke: #fcfcfb; stroke-width: 2; } .mark { stroke: #0b0b0b; stroke-width: 1.5; } .today { stroke: #0b0b0b; stroke-width: 1.5; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; } .s5 { fill: #e87ba4; } .gray { fill: #898781; } .onfill { fill: #0b0b0b; }
  .h1 { fill: #cde2fb; } .h2 { fill: #86b6ef; } .h3 { fill: #3987e5; } .h4 { fill: #1c5cab; } .h5 { fill: #0d366b; }
  .t1, .t2, .t3 { fill: #0b0b0b; } .t4, .t5 { fill: #ffffff; }
  .ok { fill: #0ca30c; } .warn { fill: #fab219; } .bad { fill: #d03b3b; } .glyph { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .ink3 { fill: #898781; } .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .box { fill: #242422; stroke: #4a4a46; } .grp { fill: #20201f; stroke: #2c2c2a; } .track { fill: #2c2c2a; }
    .k1 { fill: #17263a; stroke: #3987e5; } .k2 { fill: #3a2218; stroke: #d95926; }
    .kadd { fill: #12281f; stroke: #199e70; } .krem { fill: #3a1c1c; stroke: #e66767; }
    .line { stroke: #c3c2b7; } .dash { stroke: #7a7972; } .dot { stroke: #c3c2b7; } .head { fill: #c3c2b7; }
    .ladd { stroke: #199e70; } .lrem { stroke: #e66767; } .hadd { fill: #199e70; } .hrem { fill: #e66767; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .link { stroke: #5a5a55; } .ring { stroke: #1a1a19; } .mark { stroke: #f0efec; } .today { stroke: #f0efec; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; } .s5 { fill: #d55181; }
    .h1 { fill: #0d366b; } .h2 { fill: #184f95; } .h3 { fill: #256abf; } .h4 { fill: #3987e5; } .h5 { fill: #9ec5f4; }
    .t1, .t2, .t3 { fill: #f0efec; } .t4, .t5 { fill: #0b0b0b; }
  }
</style>
<rect class="bg" width="930" height="368"/>
<g transform="translate(20,20)"><polyline class="dash" points="56,110 56,26 376,26"/><polygon class="head" points="376,26 368.6,22.9 368.6,29.1"/><polyline class="line" points="112,136 389,136"/><polygon class="head" points="389,136 381.6,132.9 381.6,139.1"/><polyline class="dot" points="445,102 445,52"/><polygon class="head" points="445,52 441.9,59.4 448.1,59.4"/><polyline class="line" points="501,136 778,136"/><polygon class="head" points="778,136 770.6,132.9 770.6,139.1"/><polyline class="dot" points="834,110 834,26 514,26"/><polygon class="head" points="514,26 521.4,29.1 521.4,22.9"/><polyline class="line" points="834,162 834,220"/><polygon class="head" points="834,220 837.1,212.6 830.9,212.6"/><polyline class="dash" points="778,254 56,254 56,162"/><polygon class="head" points="56,162 52.9,169.4 59.1,169.4"/><rect class="box" x="0" y="110" width="112" height="52" rx="6"/><text x="56" y="132" class="ink" font-size="12" text-anchor="middle" font-weight="600">顧客のアプリ</text><text x="56" y="148" class="ink2" font-size="11" text-anchor="middle" font-weight="400">顧客が使う</text><rect class="box" x="376" y="0" width="138" height="52" rx="6"/><text x="445" y="22" class="ink" font-size="12" text-anchor="middle" font-weight="600">認可サーバー</text><text x="445" y="38" class="ink2" font-size="11" text-anchor="middle" font-weight="400">保険会社が証明を出す</text><rect class="k1" x="389" y="102" width="112" height="68" rx="6"/><text x="445" y="124" class="ink" font-size="12" text-anchor="middle" font-weight="600">営業 AI</text><text x="445" y="140" class="ink2" font-size="11" text-anchor="middle" font-weight="400">エージェント</text><text x="445" y="156" class="ink2" font-size="11" text-anchor="middle" font-weight="400">案を示し、運ぶ</text><rect class="box" x="778" y="110" width="112" height="52" rx="6"/><text x="834" y="132" class="ink" font-size="12" text-anchor="middle" font-weight="600">事務</text><text x="834" y="148" class="ink2" font-size="11" text-anchor="middle" font-weight="400">サービス</text><rect class="box" x="778" y="220" width="112" height="68" rx="6"/><text x="834" y="242" class="ink" font-size="12" text-anchor="middle" font-weight="600">保険会社の</text><text x="834" y="258" class="ink2" font-size="11" text-anchor="middle" font-weight="400">システム</text><text x="834" y="274" class="ink2" font-size="11" text-anchor="middle" font-weight="400">C を検証し記録</text><rect class="bg" x="146.6" y="17.5" width="138.9" height="17"/><text x="216" y="29.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">ログインし、A を受け取る</text><rect class="bg" x="197.6" y="127.5" width="105.9" height="17"/><text x="250.5" y="139.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">署名した申込みと A</text><rect class="bg" x="401.9" y="68.5" width="86.3" height="17"/><text x="445" y="80.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">A を B に替える</text><rect class="bg" x="586.6" y="127.5" width="105.9" height="17"/><text x="639.5" y="139.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">B で代理で申し込む</text><rect class="bg" x="630.9" y="17.5" width="86.3" height="17"/><text x="674" y="29.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">B を C に替える</text><rect class="bg" x="786.6" y="182.5" width="94.9" height="17"/><text x="834" y="194.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">C で申込みを回す</text><rect class="bg" x="374.5" y="245.5" width="85" height="17"/><text x="417" y="257.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">契約内容の直送</text></g><rect class="k1" x="20" y="322" width="10" height="10" rx="2"/><text x="36" y="331" class="ink" font-size="12" text-anchor="start" font-weight="400">書き換えうる中継者</text><text x="20" y="350" class="ink2" font-size="11" text-anchor="start" font-weight="400">A〜C はトークン（保険会社が出す証明）。実線は AI が運ぶ申込みと証明、破線は AI が触れない顧客との直接のやりとり、点線は証明の交換。</text>
</svg>
