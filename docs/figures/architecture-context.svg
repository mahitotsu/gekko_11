<g transform="translate(20,20)"><rect class="grp" x="174" y="0" width="736" height="342" rx="8"/><text x="184" y="18" class="ink2" font-size="11" text-anchor="start" font-weight="600">保険会社のクラスタ（サービスどうしは SPIFFE の mTLS）</text><polyline class="dash" points="112,168 197,168"/><polygon class="head" points="197,168 189.6,164.9 189.6,171.1"/><polyline class="dash" points="253,134 253,76"/><polygon class="head" points="253,76 249.9,83.4 256.1,83.4"/><polyline class="line" points="309,168 401,168"/><polygon class="head" points="401,168 393.6,164.9 393.6,171.1"/><polyline class="dot" points="457,134 457,76"/><polygon class="head" points="457,76 453.9,83.4 460.1,83.4"/><polyline class="line" points="513,168 784,168"/><polygon class="head" points="784,168 776.6,164.9 776.6,171.1"/><polyline class="dot" points="840,142 840,50 520,50"/><polygon class="head" points="520,50 527.4,53.1 527.4,46.9"/><polyline class="line" points="840,194 840,260"/><polygon class="head" points="840,260 843.1,252.6 836.9,252.6"/><polyline class="dash" points="784,294 253,294 253,202"/><polygon class="head" points="253,202 249.9,209.4 256.1,209.4"/><rect class="box" x="0" y="134" width="112" height="68" rx="6"/><text x="56" y="156" class="ink" font-size="12" text-anchor="middle" font-weight="600">顧客のアプリ</text><text x="56" y="172" class="ink2" font-size="11" text-anchor="middle" font-weight="400">の画面</text><text x="56" y="188" class="ink2" font-size="11" text-anchor="middle" font-weight="400">署名する</text><rect class="box" x="197" y="134" width="112" height="68" rx="6"/><text x="253" y="156" class="ink" font-size="12" text-anchor="middle" font-weight="600">顧客のアプリ</text><text x="253" y="172" class="ink2" font-size="11" text-anchor="middle" font-weight="400">の BFF</text><text x="253" y="188" class="ink2" font-size="11" text-anchor="middle" font-weight="400">A を持つ</text><rect class="box" x="188" y="24" width="130" height="52" rx="6"/><text x="253" y="46" class="ink" font-size="12" text-anchor="middle" font-weight="600">ログインサーバー</text><text x="253" y="62" class="ink2" font-size="11" text-anchor="middle" font-weight="400">ログインで A を出す</text><rect class="box" x="394" y="24" width="126" height="52" rx="6"/><text x="457" y="46" class="ink" font-size="12" text-anchor="middle" font-weight="600">認可サーバー</text><text x="457" y="62" class="ink2" font-size="11" text-anchor="middle" font-weight="400">A を確かめて替える</text><rect class="k1" x="401" y="134" width="112" height="68" rx="6"/><text x="457" y="156" class="ink" font-size="12" text-anchor="middle" font-weight="600">営業 AI</text><text x="457" y="172" class="ink2" font-size="11" text-anchor="middle" font-weight="400">エージェント</text><text x="457" y="188" class="ink2" font-size="11" text-anchor="middle" font-weight="400">案を示し、運ぶ</text><rect class="box" x="784" y="142" width="112" height="52" rx="6"/><text x="840" y="164" class="ink" font-size="12" text-anchor="middle" font-weight="600">事務</text><text x="840" y="180" class="ink2" font-size="11" text-anchor="middle" font-weight="400">サービス</text><rect class="box" x="784" y="260" width="112" height="68" rx="6"/><text x="840" y="282" class="ink" font-size="12" text-anchor="middle" font-weight="600">保険会社の</text><text x="840" y="298" class="ink2" font-size="11" text-anchor="middle" font-weight="400">システム</text><text x="840" y="314" class="ink2" font-size="11" text-anchor="middle" font-weight="400">C を検証し記録</text><rect class="bg" x="123" y="159.5" width="63" height="17"/><text x="154.5" y="171.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">操作と署名</text><rect class="bg" x="227" y="96.5" width="52" height="17"/><text x="253" y="108.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">ログイン</text><rect class="bg" x="324.1" y="159.5" width="61.9" height="17"/><text x="355" y="171.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">申込みと A</text><rect class="bg" x="413.9" y="96.5" width="86.3" height="17"/><text x="457" y="108.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">A を B に替える</text><rect class="bg" x="595.6" y="159.5" width="105.9" height="17"/><text x="648.5" y="171.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">B で代理で申し込む</text><rect class="bg" x="636.9" y="41.5" width="86.3" height="17"/><text x="680" y="53.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">B を C に替える</text><rect class="bg" x="792.6" y="218.5" width="94.9" height="17"/><text x="840" y="230.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">C で申込みを回す</text><rect class="bg" x="476" y="285.5" width="85" height="17"/><text x="518.5" y="297.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">契約内容の直送</text></g><rect class="k1" x="20" y="376" width="10" height="10" rx="2"/><text x="36" y="385" class="ink" font-size="12" text-anchor="start" font-weight="400">書き換えうる中継者</text><text x="20" y="404" class="ink2" font-size="11" text-anchor="start" font-weight="400">A〜C はトークン（保険会社が出す証明）。実線は AI が運ぶ申込みと証明、破線は AI が触れない顧客との直接のやりとり、点線は証明の交換。</text>
</svg>
