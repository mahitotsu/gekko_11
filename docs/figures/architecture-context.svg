<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 955 392" width="955" height="392" role="img" aria-labelledby="t d">
<title id="t">AI が営業員を担う構成の全体像</title><desc id="d">顧客と被保険者は、それぞれ自分の端末の顧客のアプリで署名する。営業員（AI）は、署名済みの申込みを、顧客の側から保険会社の側へ運ぶ（実線）。ログインと委任の承認、契約内容の直送は、AI が触れないデータを、顧客の側と保険会社の側で直接やりとりする（破線）。MCP は、AI から受け取ったトークンを、保険会社の中で認可サーバーに替えてもらう（点線）。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
