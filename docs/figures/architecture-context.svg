<g transform="translate(20,20)"><rect class="grp" x="192" y="111" width="144" height="90" rx="8"/><text x="202" y="129" class="ink2" font-size="11" text-anchor="start" font-weight="600">顧客の側</text><rect class="grp" x="760" y="0" width="155" height="312" rx="8"/><text x="770" y="18" class="ink2" font-size="11" text-anchor="start" font-weight="600">保険会社の側</text><polyline class="line" points="130,161 206,161"/><polygon class="head" points="206,161 198.6,157.9 198.6,164.1"/><polyline class="line" points="322,161 398,161"/><polygon class="head" points="398,161 390.6,157.9 390.6,164.1"/><polyline class="line" points="510,161 781.5,161"/><polygon class="head" points="781.5,161 774.1,157.9 774.1,164.1"/><polyline class="dot" points="837.5,135 837.5,76"/><polygon class="head" points="837.5,76 834.4,83.4 840.6,83.4"/><polyline class="line" points="837.5,187 837.5,246"/><polygon class="head" points="837.5,246 840.6,238.6 834.4,238.6"/><polyline class="dash" points="264,135 264,50 774,50"/><polygon class="head" points="774,50 766.6,46.9 766.6,53.1"/><polyline class="dash" points="779.5,272 264,272 264,187"/><polygon class="head" points="264,187 260.9,194.4 267.1,194.4"/><rect class="box" x="12" y="134" width="118" height="54" rx="6"/><text x="77" y="157" class="ink" font-size="12" text-anchor="middle" font-weight="600">顧客、被保険者</text><text x="77" y="173" class="ink2" font-size="11" text-anchor="middle" font-weight="400">自分の端末で</text><circle class="ink2" cx="6" cy="155" r="4.5"/><path class="ink2" d="M-3,171 Q-3,162 6,162 Q15,162 15,171 Z"/><rect class="box" x="206" y="135" width="116" height="52" rx="6"/><text x="264" y="157" class="ink" font-size="12" text-anchor="middle" font-weight="600">顧客のアプリ</text><text x="264" y="173" class="ink2" font-size="11" text-anchor="middle" font-weight="400">利用者の鍵で署名</text><rect class="k1" x="398" y="135" width="112" height="52" rx="6"/><text x="454" y="157" class="ink" font-size="12" text-anchor="middle" font-weight="600">営業員（AI）</text><text x="454" y="173" class="ink2" font-size="11" text-anchor="middle" font-weight="400">案を選び、運ぶ</text><rect class="box" x="781.5" y="135" width="112" height="52" rx="6"/><text x="837.5" y="157" class="ink" font-size="12" text-anchor="middle" font-weight="600">MCP</text><text x="837.5" y="173" class="ink2" font-size="11" text-anchor="middle" font-weight="400">事務の受付</text><rect class="box" x="774" y="24" width="127" height="52" rx="6"/><text x="837.5" y="46" class="ink" font-size="12" text-anchor="middle" font-weight="600">認可サーバー</text><text x="837.5" y="62" class="ink2" font-size="11" text-anchor="middle" font-weight="400">トークンを発行する</text><rect class="box" x="779.5" y="246" width="116" height="52" rx="6"/><text x="837.5" y="268" class="ink" font-size="12" text-anchor="middle" font-weight="600">バックエンド</text><text x="837.5" y="284" class="ink2" font-size="11" text-anchor="middle" font-weight="400">検証して記録する</text><rect class="bg" x="142" y="152.5" width="52" height="17"/><text x="168" y="164.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">署名する</text><rect class="bg" x="345" y="152.5" width="30" height="17"/><text x="360" y="164.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">渡す</text><rect class="bg" x="592.3" y="152.5" width="107" height="17"/><text x="645.8" y="164.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">案を求め、回付する</text><rect class="bg" x="789.5" y="97" width="96" height="17"/><text x="837.5" y="109" class="ink2" font-size="11" text-anchor="middle" font-weight="400">トークンを替える</text><rect class="bg" x="806" y="208" width="63" height="17"/><text x="837.5" y="220" class="ink2" font-size="11" text-anchor="middle" font-weight="400">案と申込み</text><rect class="bg" x="460" y="41.5" width="118" height="17"/><text x="519" y="53.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">ログインと委任の承認</text><rect class="bg" x="479.3" y="263.5" width="85" height="17"/><text x="521.8" y="275.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">契約内容の直送</text></g><rect class="k1" x="20" y="346" width="10" height="10" rx="2"/><text x="36" y="355" class="ink" font-size="12" text-anchor="start" font-weight="400">書き換えうる中継者</text><text x="20" y="374" class="ink2" font-size="11" text-anchor="start" font-weight="400">実線は AI が運ぶ申込み、破線は AI が触れない顧客との直接のやりとり、点線は保険会社の中のトークンの交換。</text>
</svg>
