<text x="20" y="30" class="ink" font-size="13" text-anchor="start" font-weight="600">これまで</text><text x="395.2" y="30" class="ink" font-size="13" text-anchor="start" font-weight="600">AI が間に入ると</text><line class="axis" x1="371.7" x2="371.7" y1="20" y2="198.5"/><g transform="translate(20,48) scale(1)"><polyline class="line" points="124,24 200,24"/><polygon class="head" points="200,24 192.6,20.9 192.6,27.1"/><rect class="box" x="12" y="0" width="112" height="48" rx="6"/><text x="74" y="28" class="ink" font-size="12" text-anchor="middle" font-weight="600">利用者</text><circle class="ink2" cx="6" cy="18" r="4.5"/><path class="ink2" d="M-3,34 Q-3,25 6,25 Q15,25 15,34 Z"/><rect class="box" x="200" y="2" width="136" height="44" rx="6"/><text x="268" y="28" class="ink" font-size="12" text-anchor="middle" font-weight="600">保険会社のサービス</text><rect class="bg" x="130.5" y="15.5" width="63" height="17"/><text x="162" y="27.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">自分で使う</text></g><g transform="translate(395.2,48) scale(1)"><polyline class="ladd" points="124,26 200,26"/><polygon class="hadd" points="200,26 192.6,22.9 192.6,29.1"/><polyline class="ladd" points="256,52 256,102"/><polygon class="hadd" points="256,102 259.1,94.6 252.9,94.6"/><polyline class="ladd" points="200,128 118,128"/><polygon class="hadd" points="118,128 125.4,131.1 125.4,124.9"/><rect class="box" x="12" y="2" width="112" height="48" rx="6"/><text x="74" y="30" class="ink" font-size="12" text-anchor="middle" font-weight="600">利用者</text><circle class="ink2" cx="6" cy="20" r="4.5"/><path class="ink2" d="M-3,36 Q-3,27 6,27 Q15,27 15,36 Z"/><rect class="kadd" x="200" y="0" width="112" height="52" rx="6"/><text x="256" y="22" class="ink" font-size="12" text-anchor="middle" font-weight="600">AI</text><text x="256" y="38" class="ink2" font-size="11" text-anchor="middle" font-weight="400">代理人</text><circle class="hadd ring" cx="310" cy="2" r="9"/><polyline class="glyph" points="306,2 314,2"/><polyline class="glyph" points="310,-2 310,6"/><rect class="kadd" x="200" y="102" width="112" height="52" rx="6"/><text x="256" y="124" class="ink" font-size="12" text-anchor="middle" font-weight="600">取り次ぎの</text><text x="256" y="140" class="ink2" font-size="11" text-anchor="middle" font-weight="400">サービス</text><circle class="hadd ring" cx="310" cy="104" r="9"/><polyline class="glyph" points="306,104 314,104"/><polyline class="glyph" points="310,100 310,108"/><rect class="box" x="6" y="102" width="112" height="52" rx="6"/><text x="62" y="124" class="ink" font-size="12" text-anchor="middle" font-weight="600">保険会社の</text><text x="62" y="140" class="ink2" font-size="11" text-anchor="middle" font-weight="400">サービス</text><rect class="bg" x="147" y="17.5" width="30" height="17"/><text x="162" y="29.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">頼む</text><rect class="bg" x="230" y="68.5" width="52" height="17"/><text x="256" y="80.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">取り次ぐ</text><rect class="bg" x="133" y="119.5" width="52" height="17"/><text x="159" y="131.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">取り次ぐ</text></g><circle class="hadd ring" cx="28" cy="221.5" r="9"/><polyline class="glyph" points="24,221.5 32,221.5"/><polyline class="glyph" points="28,217.5 28,225.5"/><text x="44" y="225.5" class="ink" font-size="12" text-anchor="start" font-weight="400">追加</text><circle class="hrem ring" cx="104" cy="221.5" r="9"/><polyline class="glyph" points="100,221.5 108,221.5"/><text x="120" y="225.5" class="ink" font-size="12" text-anchor="start" font-weight="400">削除（破線）</text><rect class="box" x="220" y="215.45977011494253" width="16" height="12" rx="3"/><text x="242" y="225.5" class="ink" font-size="12" text-anchor="start" font-weight="400">変更なし</text><text x="20" y="246.5" class="ink2" font-size="11" text-anchor="start" font-weight="400">段ごとに、相手は「この取引をしてよい」という権限の証明を受け取る。</text>
