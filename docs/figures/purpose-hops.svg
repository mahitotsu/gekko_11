<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 265" width="720" height="265" role="img" aria-labelledby="t d">
<title id="t">AI が間に入ると、取り次ぎが重なる</title><desc id="d">これまでは、利用者が自分でサービスを使っていた。AI が間に入ると、利用者が AI に頼み、AI が取り次ぎのサービスを呼び、取り次ぎのサービスが保険会社のサービスを呼ぶ。代理と取り次ぎが、何段にも重なる。</desc>
<style>
