<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 856" width="780" height="856" role="img" aria-labelledby="t d">
<title id="t">営業 AI エージェントが顧客と保険会社の間に入る構成での、案の提示から直送までの流れ</title><desc id="d">顧客のアプリは、ログインサーバーにログインして ID トークンとトークン A を受け取り、意向と A を営業 AI エージェントに伝える。営業 AI エージェントは A を B に替えて事務サービスに試算の条件と組み立てた案を渡し、事務サービスは B を C に替えて保険会社のシステムに渡す。保険会社が署名した案は、事務サービスと営業 AI エージェントを通って顧客に示される。顧客が選択して署名すると、営業 AI エージェントは B で代理で申し込み、事務サービスは C で保険会社のシステムに回す。保険会社のシステムは C と署名の連鎖を検証して記録を作り、契約内容を顧客のアプリへ直接送る。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .ink3 { fill: #898781; } .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .box { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1; } .grp { fill: #f4f3f0; stroke: #e1e0d9; stroke-width: 1; } .track { fill: #e1e0d9; }
  .k1 { fill: #e8f0fb; stroke: #2a78d6; stroke-width: 1.5; } .k2 { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.5; }
  .kadd { fill: #e6f6ef; stroke: #1baf7a; stroke-width: 1.5; } .krem { fill: #fdeceb; stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; }
  .line { stroke: #52514e; stroke-width: 1.5; fill: none; } .dash { stroke: #9a9992; stroke-width: 1; stroke-dasharray: 4 3; fill: none; } .dot { stroke: #52514e; stroke-width: 2; stroke-dasharray: 0 5; stroke-linecap: round; fill: none; } .head { fill: #52514e; }
  .ladd { stroke: #1baf7a; stroke-width: 2; fill: none; } .lrem { stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; } .hadd { fill: #1baf7a; } .hrem { fill: #e34948; }
  .l1, .l2, .l3, .lg { stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; } .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; } .lg { stroke: #898781; }
  .link { stroke: #c3c2b7; stroke-width: 3; stroke-linecap: round; } .ring { stroke: #fcfcfb; stroke-width: 2; } .mark { stroke: #0b0b0b; stroke-width: 1.5; } .today { stroke: #0b0b0b; stroke-width: 1.5; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; } .s5 { fill: #e87ba4; } .gray { fill: #898781; } .onfill { fill: #0b0b0b; }
  .h1 { fill: #cde2fb; } .h2 { fill: #86b6ef; } .h3 { fill: #3987e5; } .h4 { fill: #1c5cab; } .h5 { fill: #0d366b; }
  .t1, .t2, .t3 { fill: #0b0b0b; } .t4, .t5 { fill: #ffffff; }
  .ok { fill: #0ca30c; } .warn { fill: #fab219; } .bad { fill: #d03b3b; } .glyph { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .ink3 { fill: #898781; } .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .box { fill: #242422; stroke: #4a4a46; } .grp { fill: #20201f; stroke: #2c2c2a; } .track { fill: #2c2c2a; }
    .k1 { fill: #17263a; stroke: #3987e5; } .k2 { fill: #3a2218; stroke: #d95926; }
    .kadd { fill: #12281f; stroke: #199e70; } .krem { fill: #3a1c1c; stroke: #e66767; }
    .line { stroke: #c3c2b7; } .dash { stroke: #7a7972; } .dot { stroke: #c3c2b7; } .head { fill: #c3c2b7; }
    .ladd { stroke: #199e70; } .lrem { stroke: #e66767; } .hadd { fill: #199e70; } .hrem { fill: #e66767; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .link { stroke: #5a5a55; } .ring { stroke: #1a1a19; } .mark { stroke: #f0efec; } .today { stroke: #f0efec; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; } .s5 { fill: #d55181; }
    .h1 { fill: #0d366b; } .h2 { fill: #184f95; } .h3 { fill: #256abf; } .h4 { fill: #3987e5; } .h5 { fill: #9ec5f4; }
    .t1, .t2, .t3 { fill: #f0efec; } .t4, .t5 { fill: #0b0b0b; }
  }
</style>
<rect class="bg" width="780" height="856"/>
<line class="dash" x1="76" x2="76" y1="60" y2="818"/><line class="dash" x1="196.6" x2="196.6" y1="60" y2="818"/><line class="dash" x1="316.6" x2="316.6" y1="60" y2="818"/><line class="dash" x1="463.6" x2="463.6" y1="60" y2="818"/><line class="dash" x1="583.6" x2="583.6" y1="60" y2="818"/><line class="dash" x1="703.6" x2="703.6" y1="60" y2="818"/><rect class="box" x="24" y="16" width="104" height="44" rx="6"/><text x="76" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">顧客のアプリ</text><text x="76" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">署名する</text><rect class="box" x="144.6" y="16" width="104" height="44" rx="6"/><text x="196.6" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">ログイン</text><text x="196.6" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">サーバー</text><rect class="k1" x="264.6" y="16" width="104" height="44" rx="6"/><text x="316.6" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">営業 AI</text><text x="316.6" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">エージェント</text><rect class="box" x="411.6" y="16" width="104" height="44" rx="6"/><text x="463.6" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">事務</text><text x="463.6" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">サービス</text><rect class="box" x="531.6" y="16" width="104" height="44" rx="6"/><text x="583.6" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">認可サーバー</text><text x="583.6" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">A を替える</text><rect class="box" x="651.6" y="16" width="104" height="44" rx="6"/><text x="703.6" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">保険会社の</text><text x="703.6" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">システム</text><polyline class="line" points="78,90 194.6,90"/><polygon class="head" points="194.6,90 187.2,86.9 187.2,93.1"/><text x="136.3" y="83" class="ink" font-size="12" text-anchor="middle" font-weight="400">ログインする</text><polyline class="dash" points="194.6,130 78,130"/><polyline class="line" points="85.2,133.5 78,130 85.2,126.5"/><text x="136.3" y="123" class="ink" font-size="12" text-anchor="middle" font-weight="400">ID トークンと A</text><polyline class="line" points="78,170 314.6,170"/><polygon class="head" points="314.6,170 307.2,166.9 307.2,173.1"/><text x="196.3" y="163" class="ink" font-size="12" text-anchor="middle" font-weight="400">意向と A を伝える</text><polyline class="line" points="318.6,210 581.6,210"/><polygon class="head" points="581.6,210 574.2,206.9 574.2,213.1"/><text x="450.1" y="203" class="ink" font-size="12" text-anchor="middle" font-weight="400">A を B に替える</text><polyline class="dash" points="581.6,250 318.6,250"/><polyline class="line" points="325.8,253.5 318.6,250 325.8,246.5"/><text x="450.1" y="243" class="ink" font-size="12" text-anchor="middle" font-weight="400">B（本人と AI が残る）</text><polyline class="line" points="318.6,290 461.6,290"/><polygon class="head" points="461.6,290 454.2,286.9 454.2,293.1"/><text x="390.1" y="283" class="ink" font-size="12" text-anchor="middle" font-weight="400">試算と案の提出（B）</text><polyline class="line" points="465.6,330 581.6,330"/><polygon class="head" points="581.6,330 574.2,326.9 574.2,333.1"/><text x="523.6" y="323" class="ink" font-size="12" text-anchor="middle" font-weight="400">B を C に替える</text><polyline class="dash" points="581.6,370 465.6,370"/><polyline class="line" points="472.8,373.5 465.6,370 472.8,366.5"/><text x="523.6" y="363" class="ink" font-size="12" text-anchor="middle" font-weight="400">C</text><polyline class="line" points="465.6,410 701.6,410"/><polygon class="head" points="701.6,410 694.2,406.9 694.2,413.1"/><text x="583.6" y="403" class="ink" font-size="12" text-anchor="middle" font-weight="400">試算と案の提出（C）</text><polyline class="dash" points="701.6,450 465.6,450"/><polyline class="line" points="472.8,453.5 465.6,450 472.8,446.5"/><text x="583.6" y="443" class="ink" font-size="12" text-anchor="middle" font-weight="400">保険会社が署名した案</text><polyline class="dash" points="461.6,490 318.6,490"/><polyline class="line" points="325.8,493.5 318.6,490 325.8,486.5"/><text x="390.1" y="483" class="ink" font-size="12" text-anchor="middle" font-weight="400">署名つきの案</text><polyline class="line" points="314.6,530 78,530"/><polygon class="head" points="78,530 85.4,533.1 85.4,526.9"/><text x="196.3" y="523" class="ink" font-size="12" text-anchor="middle" font-weight="400">案を顧客に示す</text><rect class="grp" x="57.2" y="556" width="278.3" height="26" rx="4"/><text x="196.3" y="574" class="ink2" font-size="11" text-anchor="middle" font-weight="400">AI は条件を選べるが、署名された案は変えられない</text><polyline class="line" points="78,610 314.6,610"/><polygon class="head" points="314.6,610 307.2,606.9 307.2,613.1"/><text x="196.3" y="603" class="ink" font-size="12" text-anchor="middle" font-weight="400">選択して署名する（2 段）</text><polyline class="line" points="318.6,650 461.6,650"/><polygon class="head" points="461.6,650 454.2,646.9 454.2,653.1"/><text x="390.1" y="643" class="ink" font-size="12" text-anchor="middle" font-weight="400">代理で申し込む（B）</text><polyline class="line" points="465.6,690 701.6,690"/><polygon class="head" points="701.6,690 694.2,686.9 694.2,693.1"/><text x="583.6" y="683" class="ink" font-size="12" text-anchor="middle" font-weight="400">申込みを回す（C）</text><rect class="grp" x="455.6" y="716" width="256" height="26" rx="4"/><text x="583.6" y="734" class="ink2" font-size="11" text-anchor="middle" font-weight="400">C と署名の連鎖を検証し、記録を作る</text><polyline class="line" points="701.6,770 78,770"/><polygon class="head" points="78,770 85.4,773.1 85.4,766.9"/><text x="389.8" y="763" class="ink" font-size="12" text-anchor="middle" font-weight="400">契約内容を直接送る（AI を通らない）</text><text x="24" y="846" class="ink2" font-size="11" text-anchor="start" font-weight="400">実線は依頼や受け渡し、破線は戻り。</text>
</svg>
