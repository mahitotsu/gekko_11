<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 883 616" width="883" height="616" role="img" aria-labelledby="t d">
<title id="t">AI が営業員を担う構成での、案の提示から直送までの流れ</title><desc id="d">顧客のアプリが営業員（AI）に意向を伝える。営業員は MCP に案を求め、MCP は認可サーバーに、宛先を絞ったトークンへの交換を頼む。替えたトークンには、本人と経由した営業員が残る。バックエンドは、保険会社が署名した案を返す。顧客はアプリで案を選んで署名し、営業員が署名済みの申込みを MCP 経由で回付する。バックエンドはトークンと署名の連鎖を検証して記録を作り、契約内容を営業員を通さずに顧客のアプリへ直接送る。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .ink3 { fill: #898781; } .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .box { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1; } .grp { fill: #f4f3f0; stroke: #e1e0d9; stroke-width: 1; } .track { fill: #e1e0d9; }
  .k1 { fill: #e8f0fb; stroke: #2a78d6; stroke-width: 1.5; } .k2 { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.5; }
  .kadd { fill: #e6f6ef; stroke: #1baf7a; stroke-width: 1.5; } .krem { fill: #fdeceb; stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; }
  .line { stroke: #52514e; stroke-width: 1.5; fill: none; } .dash { stroke: #9a9992; stroke-width: 1; stroke-dasharray: 4 3; fill: none; } .head { fill: #52514e; }
  .ladd { stroke: #1baf7a; stroke-width: 2; fill: none; } .lrem { stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; } .hadd { fill: #1baf7a; } .hrem { fill: #e34948; }
  .l1, .l2, .l3, .lg { stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; } .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; } .lg { stroke: #898781; }
  .link { stroke: #c3c2b7; stroke-width: 3; stroke-linecap: round; } .ring { stroke: #fcfcfb; stroke-width: 2; } .mark { stroke: #0b0b0b; stroke-width: 1.5; } .today { stroke: #0b0b0b; stroke-width: 1.5; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; } .s5 { fill: #e87ba4; } .gray { fill: #898781; } .onfill { fill: #0b0b0b; }
  .h1 { fill: #cde2fb; } .h2 { fill: #86b6ef; } .h3 { fill: #3987e5; } .h4 { fill: #1c5cab; } .h5 { fill: #0d366b; }
  .t1, .t2, .t3 { fill: #0b0b0b; } .t4, .t5 { fill: #ffffff; }
  .ok { fill: #0ca30c; } .warn { fill: #fab219; } .bad { fill: #d03b3b; } .glyph { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .ink3 { fill: #898781; } .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .box { fill: #242422; stroke: #4a4a46; } .grp { fill: #20201f; stroke: #2c2c2a; } .track { fill: #2c2c2a; }
    .k1 { fill: #17263a; stroke: #3987e5; } .k2 { fill: #3a2218; stroke: #d95926; }
    .kadd { fill: #12281f; stroke: #199e70; } .krem { fill: #3a1c1c; stroke: #e66767; }
    .line { stroke: #c3c2b7; } .dash { stroke: #7a7972; } .head { fill: #c3c2b7; }
    .ladd { stroke: #199e70; } .lrem { stroke: #e66767; } .hadd { fill: #199e70; } .hrem { fill: #e66767; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .link { stroke: #5a5a55; } .ring { stroke: #1a1a19; } .mark { stroke: #f0efec; } .today { stroke: #f0efec; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; } .s5 { fill: #d55181; }
    .h1 { fill: #0d366b; } .h2 { fill: #184f95; } .h3 { fill: #256abf; } .h4 { fill: #3987e5; } .h5 { fill: #9ec5f4; }
    .t1, .t2, .t3 { fill: #f0efec; } .t4, .t5 { fill: #0b0b0b; }
  }
</style>
<rect class="bg" width="883" height="616"/>
<line class="dash" x1="76" x2="76" y1="60" y2="578"/><line class="dash" x1="310.8" x2="310.8" y1="60" y2="578"/><line class="dash" x1="486.8" x2="486.8" y1="60" y2="578"/><line class="dash" x1="662.8" x2="662.8" y1="60" y2="578"/><line class="dash" x1="800.3" x2="800.3" y1="60" y2="578"/><rect class="box" x="24" y="16" width="104" height="44" rx="6"/><text x="76" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">顧客のアプリ</text><text x="76" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">署名する</text><rect class="k1" x="258.3" y="16" width="105" height="44" rx="6"/><text x="310.8" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">営業員（AI）</text><text x="310.8" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">案を選び、運ぶ</text><rect class="box" x="434.8" y="16" width="104" height="44" rx="6"/><text x="486.8" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">MCP</text><text x="486.8" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">事務の受付</text><rect class="box" x="599.3" y="16" width="127" height="44" rx="6"/><text x="662.8" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">認可サーバー</text><text x="662.8" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">トークンを発行する</text><rect class="box" x="742.3" y="16" width="116" height="44" rx="6"/><text x="800.3" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">バックエンド</text><text x="800.3" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">検証して記録する</text><polyline class="line" points="78,90 308.8,90"/><polygon class="head" points="308.8,90 301.4,86.9 301.4,93.1"/><text x="193.4" y="83" class="ink" font-size="12" text-anchor="middle" font-weight="400">意向を伝える</text><polyline class="line" points="312.8,130 484.8,130"/><polygon class="head" points="484.8,130 477.4,126.9 477.4,133.1"/><text x="398.8" y="123" class="ink" font-size="12" text-anchor="middle" font-weight="400">案を求める（営業員宛て）</text><polyline class="line" points="488.8,170 660.8,170"/><polygon class="head" points="660.8,170 653.4,166.9 653.4,173.1"/><text x="574.8" y="163" class="ink" font-size="12" text-anchor="middle" font-weight="400">宛先を絞って替えてもらう</text><polyline class="dash" points="660.8,210 488.8,210"/><polyline class="line" points="496,213.5 488.8,210 496,206.5"/><text x="574.8" y="203" class="ink" font-size="12" text-anchor="middle" font-weight="400">本人と営業員が残る</text><polyline class="line" points="488.8,250 798.3,250"/><polygon class="head" points="798.3,250 790.9,246.9 790.9,253.1"/><text x="643.6" y="243" class="ink" font-size="12" text-anchor="middle" font-weight="400">案を求める（替えた後）</text><polyline class="dash" points="798.3,290 78,290"/><polyline class="line" points="85.2,293.5 78,290 85.2,286.5"/><text x="438.2" y="283" class="ink" font-size="12" text-anchor="middle" font-weight="400">保険会社が署名した案</text><rect class="grp" x="56.9" y="316" width="273" height="26" rx="4"/><text x="193.4" y="334" class="ink2" font-size="11" text-anchor="middle" font-weight="400">営業員は案を選んで示せるが、中身は変えられない</text><polyline class="line" points="78,370 308.8,370"/><polygon class="head" points="308.8,370 301.4,366.9 301.4,373.1"/><text x="193.4" y="363" class="ink" font-size="12" text-anchor="middle" font-weight="400">選んだ案に、顧客の鍵で署名（2 段）</text><polyline class="line" points="312.8,410 484.8,410"/><polygon class="head" points="484.8,410 477.4,406.9 477.4,413.1"/><text x="398.8" y="403" class="ink" font-size="12" text-anchor="middle" font-weight="400">署名済みの申込みを回付</text><polyline class="line" points="488.8,450 798.3,450"/><polygon class="head" points="798.3,450 790.9,446.9 790.9,453.1"/><text x="643.6" y="443" class="ink" font-size="12" text-anchor="middle" font-weight="400">回付（トークンを替えて）</text><rect class="grp" x="478.8" y="476" width="329.5" height="26" rx="4"/><text x="643.6" y="494" class="ink2" font-size="11" text-anchor="middle" font-weight="400">トークンと署名の連鎖を検証し、記録を作る</text><polyline class="line" points="798.3,530 78,530"/><polygon class="head" points="78,530 85.4,533.1 85.4,526.9"/><text x="438.2" y="523" class="ink" font-size="12" text-anchor="middle" font-weight="400">契約内容を直接送る（AI を通らない）</text><text x="24" y="606" class="ink2" font-size="11" text-anchor="start" font-weight="400">実線は依頼や受け渡し、破線は戻り。</text>
</svg>
