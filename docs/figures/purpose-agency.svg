<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 576" width="752" height="576" role="img" aria-labelledby="t d">
<title id="t">代理人が間に入る取引で、取引のときに検証し、事後に確かめる</title><desc id="d">取引のとき: 顧客が営業員に本人確認書類を見せて申込みを頼み、営業員は書類で本人を確かめる。顧客が申込書に署名し、営業員は申込書と確認の記録を事務担当へ運ぶ。事務担当は、営業員の名乗りを営業員の名簿と照らし、申込書を点検してから、保険会社のシステムに入力する。事後: 事務担当は証券を、営業員を通さずに顧客へ直接送り、顧客は手元の写しと見比べる。会社は、営業員を監査し、記録を保存する。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .ink3 { fill: #898781; } .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .box { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1; } .grp { fill: #f4f3f0; stroke: #e1e0d9; stroke-width: 1; } .track { fill: #e1e0d9; }
  .k1 { fill: #e8f0fb; stroke: #2a78d6; stroke-width: 1.5; } .k2 { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.5; }
  .kadd { fill: #e6f6ef; stroke: #1baf7a; stroke-width: 1.5; } .krem { fill: #fdeceb; stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; }
  .line { stroke: #52514e; stroke-width: 1.5; fill: none; } .dash { stroke: #9a9992; stroke-width: 1; stroke-dasharray: 4 3; fill: none; } .head { fill: #52514e; }
  .ladd { stroke: #1baf7a; stroke-width: 2; fill: none; } .lrem { stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; } .hadd { fill: #1baf7a; } .hrem { fill: #e34948; }
  .l1, .l2, .l3, .lg { stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; } .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; } .lg { stroke: #898781; }
  .link { stroke: #c3c2b7; stroke-width: 3; stroke-linecap: round; } .ring { stroke: #fcfcfb; stroke-width: 2; } .mark { stroke: #0b0b0b; stroke-width: 1.5; } .today { stroke: #0b0b0b; stroke-width: 1.5; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; } .s5 { fill: #e87ba4; } .gray { fill: #898781; } .onfill { fill: #0b0b0b; }
  .h1 { fill: #cde2fb; } .h2 { fill: #86b6ef; } .h3 { fill: #3987e5; } .h4 { fill: #1c5cab; } .h5 { fill: #0d366b; }
  .t1, .t2, .t3 { fill: #0b0b0b; } .t4, .t5 { fill: #ffffff; }
  .ok { fill: #0ca30c; } .warn { fill: #fab219; } .bad { fill: #d03b3b; } .glyph { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .ink3 { fill: #898781; } .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .box { fill: #242422; stroke: #4a4a46; } .grp { fill: #20201f; stroke: #2c2c2a; } .track { fill: #2c2c2a; }
    .k1 { fill: #17263a; stroke: #3987e5; } .k2 { fill: #3a2218; stroke: #d95926; }
    .kadd { fill: #12281f; stroke: #199e70; } .krem { fill: #3a1c1c; stroke: #e66767; }
    .line { stroke: #c3c2b7; } .dash { stroke: #7a7972; } .head { fill: #c3c2b7; }
    .ladd { stroke: #199e70; } .lrem { stroke: #e66767; } .hadd { fill: #199e70; } .hrem { fill: #e66767; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .link { stroke: #5a5a55; } .ring { stroke: #1a1a19; } .mark { stroke: #f0efec; } .today { stroke: #f0efec; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; } .s5 { fill: #d55181; }
    .h1 { fill: #0d366b; } .h2 { fill: #184f95; } .h3 { fill: #256abf; } .h4 { fill: #3987e5; } .h5 { fill: #9ec5f4; }
    .t1, .t2, .t3 { fill: #f0efec; } .t4, .t5 { fill: #0b0b0b; }
  }
</style>
<rect class="bg" width="752" height="576"/>
<line class="dash" x1="76" x2="76" y1="60" y2="538"/><line class="dash" x1="276" x2="276" y1="60" y2="538"/><line class="dash" x1="476" x2="476" y1="60" y2="538"/><line class="dash" x1="676" x2="676" y1="60" y2="538"/><rect class="box" x="24" y="16" width="104" height="44" rx="6"/><text x="76" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">顧客</text><text x="76" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">本人</text><rect class="k1" x="224" y="16" width="104" height="44" rx="6"/><text x="276" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">営業員</text><text x="276" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">代理人</text><rect class="box" x="424" y="16" width="104" height="44" rx="6"/><text x="476" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">事務担当</text><text x="476" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">事務センター</text><rect class="box" x="624" y="16" width="104" height="44" rx="6"/><text x="676" y="34" class="ink" font-size="12" text-anchor="middle" font-weight="600">保険会社の</text><text x="676" y="50" class="ink2" font-size="11" text-anchor="middle" font-weight="400">システム</text><rect class="grp" x="68" y="76" width="616" height="26" rx="4"/><text x="376" y="94" class="ink2" font-size="11" text-anchor="middle" font-weight="400">取引のときの検証</text><polyline class="line" points="78,130 274,130"/><polygon class="head" points="274,130 266.6,126.9 266.6,133.1"/><text x="176" y="123" class="ink" font-size="12" text-anchor="middle" font-weight="400">本人確認書類を見せて、申込む</text><rect class="grp" x="211" y="156" width="130" height="26" rx="4"/><text x="276" y="174" class="ink2" font-size="11" text-anchor="middle" font-weight="400">書類で本人を確かめる</text><polyline class="line" points="78,210 274,210"/><polygon class="head" points="274,210 266.6,206.9 266.6,213.1"/><text x="176" y="203" class="ink" font-size="12" text-anchor="middle" font-weight="400">申込書に署名する</text><polyline class="line" points="278,250 474,250"/><polygon class="head" points="474,250 466.6,246.9 466.6,253.1"/><text x="376" y="243" class="ink" font-size="12" text-anchor="middle" font-weight="400">申込書と本人確認の記録を運ぶ</text><rect class="grp" x="439.5" y="276" width="273" height="26" rx="4"/><text x="576" y="294" class="ink2" font-size="11" text-anchor="middle" font-weight="400">名乗りを営業員の名簿と照らし、申込書を点検する</text><polyline class="line" points="478,330 674,330"/><polygon class="head" points="674,330 666.6,326.9 666.6,333.1"/><text x="576" y="323" class="ink" font-size="12" text-anchor="middle" font-weight="400">点検を終えた申込みを入力する</text><rect class="grp" x="68" y="356" width="616" height="26" rx="4"/><text x="376" y="374" class="ink2" font-size="11" text-anchor="middle" font-weight="400">事後の確認と監査</text><polyline class="line" points="474,410 78,410"/><polygon class="head" points="78,410 85.4,413.1 85.4,406.9"/><text x="276" y="403" class="ink" font-size="12" text-anchor="middle" font-weight="400">証券を直接送る（営業員を通らない）</text><rect class="grp" x="11" y="436" width="130" height="26" rx="4"/><text x="76" y="454" class="ink2" font-size="11" text-anchor="middle" font-weight="400">手元の写しと見比べる</text><rect class="grp" x="467" y="476" width="218" height="26" rx="4"/><text x="576" y="494" class="ink2" font-size="11" text-anchor="middle" font-weight="400">会社が営業員を監査し、記録を保存する</text><text x="24" y="566" class="ink2" font-size="11" text-anchor="start" font-weight="400">窓口の話は、公開されている規則を手がかりに組み立てたたとえ話である。</text>
</svg>
