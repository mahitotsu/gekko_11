<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 943 454" width="943" height="454" role="img" aria-labelledby="t d">
<title id="t">各サービスの前で、プロキシと token-guard がトークンを確かめ、アプリは内容だけを確かめる</title><desc id="d">呼ぶ側のサービスは、SPIFFE の mTLS とトークンで、プロキシを呼ぶ。プロキシは、SVID の発行基盤の agent から受け取った SVID で mTLS を受け、token-guard に確かめを頼む。token-guard は、相手の SPIFFE ID、トークン、DPoP、送信者の鍵への結び付けを確かめる。プロキシは、確かめた主張だけをアプリに渡す。アプリが次のサービスを呼ぶときは、token-guard が認可サーバーでトークンを替える（点線）。</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .ink3 { fill: #898781; } .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .box { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1; } .grp { fill: #f4f3f0; stroke: #e1e0d9; stroke-width: 1; } .track { fill: #e1e0d9; }
  .k1 { fill: #e8f0fb; stroke: #2a78d6; stroke-width: 1.5; } .k2 { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.5; }
  .kadd { fill: #e6f6ef; stroke: #1baf7a; stroke-width: 1.5; } .krem { fill: #fdeceb; stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; }
  .line { stroke: #52514e; stroke-width: 1.5; fill: none; } .dash { stroke: #9a9992; stroke-width: 1; stroke-dasharray: 4 3; fill: none; } .dot { stroke: #52514e; stroke-width: 2; stroke-dasharray: 0 5; stroke-linecap: round; fill: none; } .head { fill: #52514e; }
  .ladd { stroke: #1baf7a; stroke-width: 2; fill: none; } .lrem { stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; } .hadd { fill: #1baf7a; } .hrem { fill: #e34948; }
  .l1, .l2, .l3, .lg { stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; } .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1baf7a; } .lg { stroke: #898781; }
  .link { stroke: #c3c2b7; stroke-width: 3; stroke-linecap: round; } .ring { stroke: #fcfcfb; stroke-width: 2; } .mark { stroke: #0b0b0b; stroke-width: 1.5; } .today { stroke: #0b0b0b; stroke-width: 1.5; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s4 { fill: #eda100; } .s5 { fill: #e87ba4; } .gray { fill: #898781; } .onfill { fill: #0b0b0b; }
  .h1 { fill: #cde2fb; } .h2 { fill: #86b6ef; } .h3 { fill: #3987e5; } .h4 { fill: #1c5cab; } .h5 { fill: #0d366b; }
  .t1, .t2, .t3 { fill: #0b0b0b; } .t4, .t5 { fill: #ffffff; }
  .ok { fill: #0ca30c; } .warn { fill: #fab219; } .bad { fill: #d03b3b; } .glyph { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .ink3 { fill: #898781; } .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .box { fill: #242422; stroke: #4a4a46; } .grp { fill: #20201f; stroke: #2c2c2a; } .track { fill: #2c2c2a; }
    .k1 { fill: #17263a; stroke: #3987e5; } .k2 { fill: #3a2218; stroke: #d95926; }
    .kadd { fill: #12281f; stroke: #199e70; } .krem { fill: #3a1c1c; stroke: #e66767; }
    .line { stroke: #c3c2b7; } .dash { stroke: #7a7972; } .dot { stroke: #c3c2b7; } .head { fill: #c3c2b7; }
    .ladd { stroke: #199e70; } .lrem { stroke: #e66767; } .hadd { fill: #199e70; } .hrem { fill: #e66767; }
    .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; } .l3 { stroke: #199e70; }
    .link { stroke: #5a5a55; } .ring { stroke: #1a1a19; } .mark { stroke: #f0efec; } .today { stroke: #f0efec; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s4 { fill: #c98500; } .s5 { fill: #d55181; }
    .h1 { fill: #0d366b; } .h2 { fill: #184f95; } .h3 { fill: #256abf; } .h4 { fill: #3987e5; } .h5 { fill: #9ec5f4; }
    .t1, .t2, .t3 { fill: #f0efec; } .t4, .t5 { fill: #0b0b0b; }
  }
</style>
<rect class="bg" width="943" height="454"/>
<g transform="translate(20,20)"><rect class="grp" x="0" y="86" width="536" height="200" rx="8"/><text x="10" y="104" class="ink2" font-size="11" text-anchor="start" font-weight="600">1 つのサービスの Pod</text><polyline class="dash" points="458.5,52 458.5,110"/><polygon class="head" points="458.5,110 461.6,102.6 455.4,102.6"/><polyline class="line" points="791,136 514.5,136"/><polygon class="head" points="514.5,136 521.9,139.1 521.9,132.9"/><polyline class="line" points="458.5,162 458.5,220"/><polygon class="head" points="458.5,220 461.6,212.6 455.4,212.6"/><polyline class="line" points="402.5,136 126,136"/><polygon class="head" points="126,136 133.4,139.1 133.4,132.9"/><polyline class="dot" points="458.5,272 458.5,330"/><polygon class="head" points="458.5,330 461.6,322.6 455.4,322.6"/><rect class="box" x="390" y="0" width="137" height="52" rx="6"/><text x="458.5" y="22" class="ink" font-size="12" text-anchor="middle" font-weight="600">SVID の発行基盤</text><text x="458.5" y="38" class="ink2" font-size="11" text-anchor="middle" font-weight="400">agent（ノードごと）</text><rect class="box" x="791" y="110" width="112" height="52" rx="6"/><text x="847" y="132" class="ink" font-size="12" text-anchor="middle" font-weight="600">呼ぶ側の</text><text x="847" y="148" class="ink2" font-size="11" text-anchor="middle" font-weight="400">サービス</text><rect class="k1" x="402.5" y="110" width="112" height="52" rx="6"/><text x="458.5" y="132" class="ink" font-size="12" text-anchor="middle" font-weight="600">プロキシ</text><text x="458.5" y="148" class="ink2" font-size="11" text-anchor="middle" font-weight="400">mTLS を受ける</text><rect class="box" x="14" y="110" width="112" height="52" rx="6"/><text x="70" y="132" class="ink" font-size="12" text-anchor="middle" font-weight="600">アプリ</text><text x="70" y="148" class="ink2" font-size="11" text-anchor="middle" font-weight="400">内容を確かめる</text><rect class="k1" x="395" y="220" width="127" height="52" rx="6"/><text x="458.5" y="242" class="ink" font-size="12" text-anchor="middle" font-weight="600">token-guard</text><text x="458.5" y="258" class="ink2" font-size="11" text-anchor="middle" font-weight="400">トークンを確かめる</text><rect class="box" x="402.5" y="330" width="112" height="44" rx="6"/><text x="458.5" y="356" class="ink" font-size="12" text-anchor="middle" font-weight="600">認可サーバー</text><rect class="bg" x="423.5" y="72.5" width="70" height="17"/><text x="458.5" y="84.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">SVID を渡す</text><rect class="bg" x="606.8" y="127.5" width="92" height="17"/><text x="652.8" y="139.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">mTLS とトークン</text><rect class="bg" x="421.5" y="182.5" width="74" height="17"/><text x="458.5" y="194.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">確かめを頼む</text><rect class="bg" x="227.3" y="127.5" width="74" height="17"/><text x="264.3" y="139.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">確かめた主張</text><rect class="bg" x="394" y="292.5" width="129" height="17"/><text x="458.5" y="304.5" class="ink2" font-size="11" text-anchor="middle" font-weight="400">出口でトークンを替える</text></g><rect class="k1" x="20" y="408" width="10" height="10" rx="2"/><text x="36" y="417" class="ink" font-size="12" text-anchor="start" font-weight="400">アプリの前に置く部品（サイドカー）</text><text x="20" y="436" class="ink2" font-size="11" text-anchor="start" font-weight="400">アプリは、トークンも証明書も持たない。認可サーバーは、替えを頼む者の証明書を自分で確かめるため、mTLS を自分で受ける。</text>
</svg>
