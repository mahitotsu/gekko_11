<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顧客のアプリ</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 44rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
  section { border: 1px solid #8884; border-radius: .5rem; padding: 1rem; margin: 1rem 0; }
  .warning { color: #b00; }
  .user { text-align: right; background: #8881; padding: .4rem .8rem; border-radius: .4rem; }
  .agent table, .tool table { border-collapse: collapse; margin: .4rem 0; }
  .tool { border-left: 4px solid #8886; }
  .tool h3 { margin: 0 0 .4rem; font-size: 1rem; }
  .chosen { font-weight: bold; outline: 2px solid #1a7f37; }
  #agent-status { color: #888; }
  #error { position: sticky; top: 0; z-index: 1; color: #fff; background: #b00; padding: .6rem 1rem; border-radius: .4rem; }
  td, th { padding: .2rem .6rem; border-bottom: 1px solid #8883; text-align: left; }
  .step { font-size: .9rem; color: #888; }
  .signed { color: #1a7f37; font-weight: bold; }
  li { margin: .4rem 0; }
</style>
<script type="module" src="/app.js"></script>
</head>
<body>
<h1>教材保険会社 顧客のアプリ</h1>
<p id="error" data-testid="error" hidden></p>

<section id="login" hidden>
  <p>営業 AI エージェントに、次の範囲で申込みの取り次ぎを任せます（取決め）。</p>
  <div id="terms" data-testid="terms"></div>
  <button id="login-button" data-testid="login" type="button">同意して保険会社にログインする</button>
</section>

<section id="signed-in" hidden>
  <p>ログイン中: <strong id="whoami" data-testid="whoami"></strong></p>
</section>

<section id="register" hidden>
  <p>この端末に、署名に使う passkey と、契約内容が届く受信箱を登録します。</p>
  <button id="register-button" data-testid="register-passkey" type="button">passkey を登録する</button>
</section>

<section id="chat" hidden>
  <h2>営業 AI エージェントと相談する</h2>
  <p>営業 AI エージェントが、質問をし、案を示し、書類を用意して、署名をお願いします。署名した書類は、営業 AI エージェントが保険会社へ取り次ぎます。</p>
  <div id="conversation" data-testid="conversation"></div>
  <p id="agent-status" data-testid="agent-status" data-state="idle"></p>
  <textarea id="chat-input" data-testid="chat-input" rows="2" cols="50">老後に備えて、個人年金保険を考えています。</textarea>
  <button id="chat-send" data-testid="chat-send" type="button">送る</button>
  <h2>保険会社から直接届いた契約内容（営業 AI エージェントを通らない）</h2>
  <button id="check-inbox" data-testid="check-inbox" type="button">受信箱を照合する</button>
  <ul id="reconcile"></ul>
</section>
</body>
</html>
