# 型の検査、lint、単体テスト（TypeScript、Java、Python）と、日本語の校正を回す。
# クラスタのテスト（npm run cluster:test）は、Claude の認証情報と 30 分ほどが要るので、ここでは回さず、手元で回す。
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.cache/pip
          key: unit-${{ runner.os }}-${{ hashFiles('services/*/pom.xml', 'services/*/requirements*.txt') }}
          restore-keys: unit-${{ runner.os }}-
      - run: npm ci
      - run: npm test
      - run: npm run lint:text
      # 価値を伝えるサイト（site/）は、依存を分けた別のパッケージである（D-49）
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
